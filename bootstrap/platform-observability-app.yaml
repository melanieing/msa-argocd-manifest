# ─────────────────────────────────────────────────────────────────────────
# Platform Observability 부모 Application
# ─────────────────────────────────────────────────────────────────────────
# data 가 Healthy 된 후 sync. 자식 3개: prometheus-stack / loki-stack /
# otel-collector — 각자 외부 helm chart repo 에서 install.
# 관측성 도구는 PostgreSQL/Kafka/Redis 데이터에 직접 의존하진 않지만, 안전하게
# 데이터 plane 다 뜬 후 띄워서 metrics/logs scrape 대상이 이미 존재하게 함.
# ─────────────────────────────────────────────────────────────────────────

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-observability-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"            # data(-40) 다음, microservices(0) 보다 먼저
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/melanieing/msa-argocd-manifest.git
    targetRevision: HEAD
    path: platform/observability
    # NOTE: platform-data-app / platform-operators-app 와 달리 directory.recurse 명시 안 함.
    #   - observability/ 에는 서브폴더 없음 (loki/otel/prometheus yaml 들이 직접 옆에)
    #   - default 가 recurse: false 라 명시 시 ArgoCD 가 cluster state 에 그 필드를
    #     serialize 안 해서 OutOfSync 표시 됨 (관찰됨, 2026-05-11). 명시 제거로 default 와
    #     cluster state 일치 → Synced.

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
