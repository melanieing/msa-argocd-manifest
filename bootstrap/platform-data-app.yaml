# ─────────────────────────────────────────────────────────────────────────
# Platform Data 부모 Application
# ─────────────────────────────────────────────────────────────────────────
# operators 가 Healthy 된 후 sync. 이 부모는 platform/data 의 **top-level yaml
# 만** apply (postgres-clusters / kafka-cluster / redis-cluster — 모두 자식
# Application). 자식 Application 들이 각자 _postgres/_kafka/_redis 서브폴더의
# raw CR 을 sync.
#
# **recurse:false 가 핵심**: true 로 두면 _postgres/_kafka/_redis 의 raw CR 까지
# 부모가 직접 apply 시도 → 자식 Application 보다 먼저 적용돼서 CRD 인식 실패.
# 첫 부트스트랩 (2026-05-09) 의 sync 실패 원인.
# ─────────────────────────────────────────────────────────────────────────

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-data-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"            # operators(-50) 다음
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/melanieing/msa-argocd-manifest.git
    targetRevision: HEAD
    path: platform/data
    # ★ 의도: _postgres / _kafka / _redis 서브폴더의 raw CR 을 부모가 직접 apply 안 하도록.
    #   ArgoCD 의 directory.recurse default 가 false 라 명시 불필요. 명시 시 ArgoCD 가
    #   cluster state 에 그 필드를 serialize 안 해서 root-app 에서 OutOfSync 표시 됨
    #   (관찰됨, 2026-05-11). default 동작 그대로 사용 → cluster state 와 일치 → Synced.

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
