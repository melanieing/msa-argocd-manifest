# ─────────────────────────────────────────────────────────────────────────
# "App-of-Apps(앱 오브 앱스)" 패턴의 부모 앱.
#
# App-of-Apps
#   - Argo CD Application 한 개가, 그 안에 또 다른 Application 여러 개를 품고 있는 패턴.
#   - 이 앱(platform-of-apps)은 platform/ 폴더를 통째로 watch해서,
#     그 안에 있는 모든 yaml(=각각이 또 Application 정의)을 클러스터에 적용해.
#
# 결과적으로 어떻게 동작?
#   1) 이 platform-of-apps 가 sync 됨 (sync-wave -50)
#   2) platform/operators/cnpg-operator.yaml ←  자식 Application "cnpg-operator" 가 생김
#   3) platform/operators/strimzi-operator.yaml ← 자식 "strimzi-operator" 가 생김
#   ... 이런 식으로 platform/ 아래 모든 yaml이 자동 등록.
#
# 왜 폴더 통째로 watch?
#   - 새 컴포넌트(예: cert-manager)를 추가하고 싶으면 yaml 파일 하나 만들어서 push만 하면 됨.
#   - bootstrap/ 을 건드릴 필요 없음.
# ─────────────────────────────────────────────────────────────────────────

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-of-apps
  namespace: argocd
  annotations:
    # AppProject가 만들어진 후(-100), 자식 Application들이 만들어지기 전에 실행됨.
    argocd.argoproj.io/sync-wave: "-50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform                              # 위에서 만든 'platform' AppProject 소속

  source:
    repoURL: https://github.com/melanieing/msa-argocd-manifest.git
    targetRevision: HEAD
    path: platform                               # ← 이 폴더를 통째로 watch
    directory:
      recurse: true                              # 하위 폴더(operators/, observability/...)까지 다 훑어줘

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd                            # 자식 Application들도 argocd 네임스페이스에 만들어짐

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true                     # 자식 앱이 새 네임스페이스 필요로 하면 자동 생성
      - ServerSideApply=true
