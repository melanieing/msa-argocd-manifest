# ─────────────────────────────────────────────────────────────────────────
# Platform Operators 부모 Application
# ─────────────────────────────────────────────────────────────────────────
# 옛 단일 'platform-of-apps' 를 3개로 쪼갠 첫 번째 (operators / data / observability).
#
# 왜 쪼갰나 (2026-05-09 첫 부트스트랩에서 발견된 문제):
#   - 옛 platform-of-apps 가 platform/ 폴더를 recurse:true 로 통째로 watch.
#   - 그러면 platform/data/_postgres/ 의 raw CR (CNPG Cluster) 도 직접 apply 시도.
#   - 그런데 그 CR 의 CRD 는 cnpg-operator helm install 이 끝나야 등록됨.
#   - sync-wave 는 같은 Application 안의 리소스에만 적용되고 cross-Application
#     dependency 는 보장 안 함 → "CRD not found" 에러로 sync 5번 재시도 후 실패.
#
# 새 구조:
#   - 부모 Application 3개 (operators wave -50, data -40, observability -30).
#   - ArgoCD 가 부모를 wave 순서대로 sync 하고, **Healthy 될 때까지 대기**한 후 다음 wave.
#   - 각 부모는 자기 서브폴더만 watch (recurse:false → 서브폴더 안 raw CR 안 건드림).
#   - 자식 Application 들이 각자 서브폴더 안의 raw CR 을 sync (이때는 CRD 이미 등록됨).
# ─────────────────────────────────────────────────────────────────────────

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-operators-app
  namespace: argocd
  annotations:
    # AppProject(-100) 다음, data(-40)/observability(-30) 보다 먼저.
    argocd.argoproj.io/sync-wave: "-50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/melanieing/msa-argocd-manifest.git
    targetRevision: HEAD
    path: platform/operators                       # ← operators 서브폴더만
    # NOTE: directory.recurse default 가 false. 명시 시 ArgoCD 가 cluster state 에
    #   그 필드 serialize 안 해서 root-app 에서 cosmetic OutOfSync 표시 됨. default 사용.

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd                              # 자식 Application 들이 사는 네임스페이스

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
