# ─────────────────────────────────────────────────────────────────────────
# OpenTelemetry Collector 를 클러스터에 설치하는 Application.
#
# OpenTelemetry(OTel)?
#   - 메트릭/로그/트레이스(분산 추적)를 모으는 표준 규격 + 도구 모음.
#   - "이 회사는 Datadog 만 쓰고 저 회사는 New Relic 만 쓴다" 같은 벤더 락인을 끊으려고 만든 표준.
#
# Collector 의 역할:
#   - 마이크로서비스가 OTLP(=OTel 의 통신 규격)로 데이터 보내면 받아서,
#     적절한 백엔드(Prometheus, Loki, Tempo)로 전달.
#   - 마이크로서비스 → Collector → Prometheus/Loki/Tempo 같은 가운데 다리.
#
# Sync Wave 5:
#   - Prometheus(0), Loki(0) 가 다 뜬 후에 시작해야 의미 있음 (보낼 곳이 있어야 하니).
# ─────────────────────────────────────────────────────────────────────────

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"             # Prometheus/Loki 다음에 뜸
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.153.0                       # 2026-04-30 release
    helm:
      releaseName: otel-collector
      # OTel Collector chart 는 default values 에 image.repository 가 비어있어 (의도적 — 사용자가 변종 선택).
      # 'contrib' = 모든 receivers/exporters 포함 (Kafka, Prometheus, Loki 등 다 됨, ~250MB).
      # 'core' = 작지만 기능 제한. 학습/포트폴리오는 contrib 적합.
      # mode: deployment = single replica. 다음 라운드 (D2 OTel SDK 통합) 시 daemonset 으로 격상 가능.
      values: |
        image:
          repository: otel/opentelemetry-collector-contrib
        mode: deployment
        replicaCount: 1
        presets:
          # k8s metadata enrichment (receiver 가 Pod label 자동 attach)
          kubernetesAttributes:
            enabled: true
        # D3 fine-tune (2026-05-12) — receivers OTLP + exporters Prometheus/debug + pipelines.
        # 5 microservice 의 OTel agent (D2) 가 OTLP gRPC 4317 로 송신.
        # - traces: debug exporter (Tempo 미설치 — D5 시 격상). 또는 stdout 로그로만.
        # - metrics: prometheus exporter (Prometheus 가 collector 의 :8889 에서 scrape)
        # - logs: skip (microservice 가 OTEL_LOGS_EXPORTER=none, Loki 는 stdout 직접 수집)
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            batch: {}
            memory_limiter:
              check_interval: 1s
              limit_percentage: 75
              spike_limit_percentage: 15
          exporters:
            debug:
              verbosity: basic
            prometheus:
              endpoint: 0.0.0.0:8889
              namespace: otel
              send_timestamps: true
              metric_expiration: 5m
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [debug]            # Tempo 도입 시 otlphttp/otlp 로 변경
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [debug, prometheus]
        # Prometheus scrape 위해 추가 port 노출
        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
          prom-export:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
        # Prometheus operator 가 PodMonitor 로 collector 의 metric 자동 scrape
        podMonitor:
          enabled: true
          metricsEndpoints:
            - port: prom-export

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
