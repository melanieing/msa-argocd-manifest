# ─────────────────────────────────────────────────────────────────────────
# Loki(로키) 라는 로그 수집/저장 도구를 클러스터에 설치하는 Application.
#
# Loki = Prometheus 의 로그 버전이라고 보면 됨.
#   - Pod 들이 stdout 으로 찍는 로그를 모아서 저장
#   - Grafana 에서 "이 시각의 order-service 로그 좀 보자" 라고 검색 가능
#   - LogQL 이라는 검색어 문법 사용 (PromQL 닮음)
#
# 비용 효율 포인트:
#   - 라벨 기반 인덱싱(=각 로그에 'pod=order-service' 같은 라벨만 인덱스, 본문은 인덱스 X)
#   - 그래서 Elasticsearch 같은 풀텍스트 검색 엔진보다 훨씬 저렴
#
# Sync Wave 0: Prometheus 와 같은 그룹.
# ─────────────────────────────────────────────────────────────────────────

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki                                   # 'loki-stack' 은 deprecated, 'loki' 차트 사용
    targetRevision: 7.0.0                         # 최신 안정 (app: Loki 3.6.7)
    helm:
      releaseName: loki
      # Loki 7.x chart 는 default 가 SimpleScalable (write/read/backend 분리, S3 storage 필수).
      # 우리는 학습용 + S3 bucket 미구성이라 SingleBinary mode + filesystem storage 채택.
      # 추후 D7 작업 시 S3 도입하면 SimpleScalable 로 격상 가능.
      values: |
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          pattern_ingester:
            enabled: false
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 5Gi
        # SimpleScalable/Distributed 모드 component 들 비활성 (SingleBinary 와 중복 방지)
        write:
          replicas: 0
        read:
          replicas: 0
        backend:
          replicas: 0
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        gateway:
          enabled: false
        test:
          enabled: false
        lokiCanary:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring                         # Prometheus 와 같은 네임스페이스에 모아둠

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
