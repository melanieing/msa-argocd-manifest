# ─────────────────────────────────────────────────────────────────────────
# Strimzi 라는 Apache Kafka 운영 도구를 클러스터에 설치하는 Application.
#
# Strimzi 가 하는 일:
#   - 'Kafka' 라는 K8s 리소스 종류를 만들어줌
#   - "Kafka 클러스터 띄워줘 (KRaft 모드, broker 3개)" 라고 yaml 한 장에 시킴
#   - 우리 주문/재고 비동기 통신 (order.pending, order.inventory_reserved 같은 토픽)에 사용
#
# Sync Wave -20: CNPG와 같은 그룹 (operator는 다른 거 만들기 전에 먼저 떠야 해서)
# ─────────────────────────────────────────────────────────────────────────

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://strimzi.io/charts            # Strimzi 공식 Helm 차트 저장소
    chart: strimzi-kafka-operator
    targetRevision: 1.0.0                         # 2026-04-28 메이저 마일스톤. Kafka 4.x만 지원.
    helm:
      releaseName: strimzi
      # Issue N (2026-05-11): Strimzi operator 가 default 로 자기 namespace (kafka-system) 의
      # Kafka CR 만 watch. 우리는 Kafka CR 을 'data' namespace 에 두므로 operator 가 못 봐서
      # reconcile 안 됨 → Pod 안 뜸 → microservice Kafka client DNS resolve 실패 cascade.
      # watchAnyNamespace: true → 모든 namespace 의 Kafka CR watch (cluster-wide).
      # CNPG (cnpg-system → 모든 ns Cluster watch), Redis Operator (redis-system → 모든 ns
      # RedisCluster watch) 와 동일한 cluster-wide 패턴 → 일관성. 운영급 격상 시
      # watchNamespaces list 로 좁히면 RBAC 보안 강화.
      values: |
        watchAnyNamespace: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kafka-system                       # Strimzi 와 Kafka 클러스터가 살 네임스페이스

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
