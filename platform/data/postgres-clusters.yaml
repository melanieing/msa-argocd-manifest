# ─────────────────────────────────────────────────────────────────────────
# PostgreSQL Clusters Application (CNPG Cluster CRD ×5)
# ─────────────────────────────────────────────────────────────────────────
# platform/data/_postgres/ 폴더의 매니페스트들을 watch.
#   - namespace.yaml      : data 네임스페이스
#   - {user,product,inventory,order,notification}-db.yaml : 5개 CNPG Cluster
#
# Sync Wave -10:
#   operators(-20) 가 CNPG CRD 를 등록한 후에야 Cluster CRD 적용 가능.
#   따라서 operators 다음, 마이크로서비스 앱(10) 보다는 먼저.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-clusters
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/melanieing/msa-argocd-manifest.git
    targetRevision: HEAD
    path: platform/data/_postgres
    directory:
      recurse: true                               # _postgres/ 안의 yaml 다 적용
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true                      # data namespace 자동 생성
      - ServerSideApply=true
