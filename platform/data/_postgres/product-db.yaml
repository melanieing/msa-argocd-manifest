# product-service 용 PostgreSQL. user-db.yaml 과 같은 패턴.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: product-db
  namespace: data
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: product
      owner: product_app
  monitoring:
    enablePodMonitor: true
  # CNPG 자동생성 'product-db-app' Secret 을 'product-service' ns 로 reflector 가 자동 복제 (Issue L)
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "product-service"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "product-service"
