# inventory-service 용 PostgreSQL.
# inventory 는 이벤트 소싱 패턴이라 inventory_event 테이블로 트래픽이 많이 들어옴
# (PDF 6.3, 6.4절). 향후 storage 확장 가능성 ↑
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: inventory-db
  namespace: data
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 5Gi                                     # 운영급에서는 더 큼
  bootstrap:
    initdb:
      database: inventory
      owner: inventory_app
  monitoring:
    enablePodMonitor: true
  # CNPG 가 자동 생성하는 '<cluster>-app' Secret 에 reflector annotation 상속 →
  # 'inventory-service' namespace 로 자동 복제 (Issue L). microservice Pod 의
  # secretKeyRef 가 자기 ns 에서 inventory-db-app 을 찾을 수 있게 됨.
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "inventory-service"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "inventory-service"
