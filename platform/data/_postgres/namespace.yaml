# ─────────────────────────────────────────────────────────────────────────
# 'data' 네임스페이스 — 모든 데이터 클러스터(PostgreSQL/Kafka/Redis)가 여기 살음
# ─────────────────────────────────────────────────────────────────────────
# 왜 통합 네임스페이스?
#   - "데이터 계층" 이라는 한 도메인으로 묶여서 관리/모니터링 직관적.
#   - Database-per-Service 원칙은 "DB 인스턴스가 분리됨" 이지 "namespace 가 분리"는 아님.
#   - 같은 namespace 라도 각 서비스는 자기 DB 만 접근 (NetworkPolicy 또는 secret 분리로).
# ─────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: data
