# order-service 용 PostgreSQL.
# Outbox 패턴 (제안서 6.5절) 으로 OrderInventoryRequestOutbox 테이블이 있어
# 주문 트래픽 = 동일 트랜잭션 내 INSERT 2건.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: order-db
  namespace: data
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: order
      owner: order_app
  monitoring:
    enablePodMonitor: true
  # CNPG 자동생성 'order-db-app' Secret 을 'order-service' ns 로 reflector 가 자동 복제 (Issue L)
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "order-service"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "order-service"
