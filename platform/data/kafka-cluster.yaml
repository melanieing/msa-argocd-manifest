# ─────────────────────────────────────────────────────────────────────────
# Kafka Cluster Application (Strimzi Kafka + KafkaTopic ×5)
# ─────────────────────────────────────────────────────────────────────────
# platform/data/_kafka/ 폴더 watch:
#   - kafka-cluster.yaml : KafkaNodePool ×2 + Kafka 클러스터
#   - topics.yaml        : KafkaTopic ×5 (PDF 부록 A)
# ─────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/melanieing/msa-argocd-manifest.git
    targetRevision: HEAD
    path: platform/data/_kafka
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
