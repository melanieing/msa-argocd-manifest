# ─────────────────────────────────────────────────────────────────────────
# Redis Cluster Application (RedisCluster CRD + Secret)
# ─────────────────────────────────────────────────────────────────────────
# platform/data/_redis/ 폴더 watch:
#   - redis-cluster.yaml : Secret + RedisCluster CRD (3 master + 3 replica)
# ─────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/melanieing/msa-argocd-manifest.git
    targetRevision: HEAD
    path: platform/data/_redis
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
